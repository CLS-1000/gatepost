[project]
name = "gatepost"
version = "0.1.0"
description = "Audit-compliance daily briefing CLI, plus the gp-canon/1 decision-record writer and offline verifier"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
seal = ["cryptography>=42"]
test = ["pytest>=8", "cryptography>=42", "numpy>=1.26"]
dev = ["pytest>=8", "cryptography>=42", "numpy>=1.26", "ruff>=0.5", "black>=24"]

[project.scripts]
gatepost = "gatepost.cli:main"
gp-verify = "gpcanon.verify:main"

[tool.setuptools]
packages = ["gatepost", "gpcanon"]

[tool.setuptools.package-dir]
gatepost = "src/gatepost"
gpcanon = "gpcanon"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# Tests import gpcanon from this checkout, however pytest is invoked (`pytest`, `python -m pytest`, an IDE).
pythonpath = [".", "src"]
testpaths = ["test", "tests"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
